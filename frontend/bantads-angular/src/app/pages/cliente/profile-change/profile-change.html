<div class="flex flex-col w-full h-full bg-zinc-800 font-mono rounded-lg border border-zinc-700 overflow-hidden shadow-2xl">

  <div class="flex w-full items-center justify-between border-b border-zinc-700 bg-zinc-900 px-5 py-4 text-sm text-zinc-300">
  </div>

  @if (loading) {
    <app-loading></app-loading>
  }

  @if(cliente){
    <div class="flex-1 flex overflow-hidden">
  
      <form class="flex-1 p-8 overflow-y-auto bg-zinc-800">
        
        <div class="max-w-6xl mx-auto">
          <header class="mb-8">
            <h1 class="text-2xl font-bold text-white mb-2">Alterar Perfil</h1>
          </header>
  
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-20 gap-y-10">
            
            <section class="space-y-6">
              <h2 class="text-blue-500 text-xs font-bold uppercase tracking-widest border-b border-zinc-700 pb-2">Informações de Acesso</h2>
              
              <div class="space-y-4">
                <div class="group">
                  <label class="block text-[12px] uppercase text-zinc-500 mb-2">CPF</label>
                  <input type="text" [value]="cliente.cpf | cpfFormatador" 
                readonly 
                    class="w-full bg-zinc-900/50 border border-zinc-700 p-4 text-zinc-600 outline-none cursor-not-allowed">
                </div>
  
                <div class="group">
                  <label class="block text-[12px] uppercase text-zinc-400 mb-2">Nome</label>
                  <input type="text" [(ngModel)]="clienteAtualizado.nome" name="nome" class="w-full bg-zinc-700/30 border border-zinc-600 p-4 text-white outline-none focus:border-white transition-all">
                </div>
  
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-[12px] uppercase text-zinc-400 mb-2">E-mail</label>
                    <input type="email" [(ngModel)]="clienteAtualizado.email" name="email" class="w-full bg-zinc-700/30 border border-zinc-600 p-4 text-white outline-none focus:border-white">
                  </div>
                </div>
              </div>
            </section>
  
            <section class="space-y-10">
              <h2 class="text-blue-500 text-xs font-bold uppercase tracking-widest border-b border-zinc-700 pb-2">Endereço e Localização</h2>
              
              <div class="space-y-4">
                <div class="grid grid-cols-3 gap-4">
                  <div class="col-span-2">
                    <label class="block text-[12px] uppercase text-zinc-400 mb-2">CEP</label>
                    <input type="text" maxlength="9"  [(ngModel)]="clienteAtualizado.cep" [numericos]="'cep'" name="cep" class="w-full bg-zinc-700/30 border border-zinc-600 p-4 text-white outline-none focus:border-white">
                  </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                  <div class="col-span-2">
                    <label class="block text-[12px] uppercase text-zinc-400 mb-2">Endereço</label>
                    <input type="text" [(ngModel)]="clienteAtualizado.endereco" name="endereco" class="w-full bg-zinc-700/30 border border-zinc-600 p-4 text-white outline-none focus:border-white">
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                  <div class="col-span-2">
                    <label class="block text-[12px] uppercase text-zinc-400 mb-2">Cidade</label>
                    <input type="text" [(ngModel)]="clienteAtualizado.cidade" name="numero" class="w-full bg-zinc-700/30 border border-zinc-600 p-4 text-white outline-none focus:border-white">
                  </div>
                  <div class="col-span-1">
                    <label class="block text-[12px] uppercase text-zinc-400 mb-2">Estado</label>
                    <input type="text" [(ngModel)]="clienteAtualizado.estado" name="cidade" class="w-full bg-zinc-700/30 border border-zinc-600 p-4 text-white outline-none focus:border-white">
                  </div>
                </div>
              </div>
            </section>
          </div>
          <div>{{ mensagemErro }}</div>
  
          <div class="mt-16 bg-zinc-900 border border-blue-900/30 p-8 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex-1">
              <label class="block text-[10px] uppercase text-blue-400 font-bold mb-3 tracking-widest">Rendimento Mensal (Salário)</label>
              <div class="flex items-center gap-4">
                <input 
                  type="text"
                  [(ngModel)]="valorFormatado"
                  [numericos]="'salario'"
                  placeholder="R$ 0,00"
                  maxlength="15"
                  name="salario"
                  class="bg-transparent text-4xl text-white font-bold outline-none w-full"/>
              </div>
            </div>
            
            <button type="button" (click)="atualizar()" class="w-full md:w-80 bg-blue-600 hover:bg-blue-500 text-white py-5 px-10 font-bold text-sm uppercase tracking-[0.3em] transition-all active:scale-95 shadow-2xl">
              Atualizar
            </button>
          </div>
  
        </div>
      </form>
    </div>
  }
</div>
